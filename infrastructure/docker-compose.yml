services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.example
    volumes:
      - ../datasets:/app/datasets
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend

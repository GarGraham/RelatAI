name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint
        run: |
          ruff check backend/relat_ai
      - name: Format check
        run: |
          black --check backend/relat_ai
      - name: Type check
        run: |
          mypy backend/relat_ai
      - name: Tests
        run: |
          pytest backend/relat_ai/tests
